<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xrigram - Social Media & Earn</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Top Header Navigation -->
    <header class="top-header">
        <h1 class="logo">Xrigram</h1>
        <div class="header-icons">
            <i class="fa-solid fa-heart header-icon"></i>
            <i class="fa-paper-plane header-icon"></i>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="main-container">

        <!-- Earn Dashboard Banner Component -->
        <section class="earn-card">
            <div class="earn-info">
                <span><i class="fa-solid fa-wallet"></i> Total Earnings</span>
                <h2>$0.00</h2>
            </div>
            <button class="claim-btn">Earn Now</button>
        </section>

        <!-- Sample Social Media Feed Post -->
        <article class="post">
            <!-- Post Header -->
            <div class="post-header">
                <div class="user-info">
                    <div class="avatar">X</div>
                    <div>
                        <h4 class="username">XRiDev Network <i class="fa-solid fa-circle-check verified"></i></h4>
                        <span class="post-time">2 mins ago</span>
                    </div>
                </div>
                <i class="fa-solid fa-ellipsis"></i>
            </div>

            <!-- Post Content -->
            <div class="post-content">
                <p>Welcome to <b>Xrigram</b>! The next-gen platform for social interaction and decentralized earning. 🚀🔥</p>
            </div>

            <!-- Post Media/Image Placeholder -->
            <div class="post-image-placeholder">
                <i class="fa-solid fa-rocket post-img-icon"></i>
            </div>

            <!-- Post Actions -->
            <div class="post-actions">
                <div class="action-btn"><i class="fa-regular fa-heart"></i> <span>124</span></div>
                <div class="action-btn"><i class="fa-regular fa-comment"></i> <span>18</span></div>
                <div class="action-btn"><i class="fa-solid fa-share"></i></div>
            </div>
        </article>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-compass"></i><span>Explore</span></a>
        <a href="#" class="nav-item earn-tab"><i class="fa-solid fa-coins"></i><span>Earn</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-bell"></i><span>Alerts</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>

    <!-- Main JavaScript File -->
    <script src="js/app.js"></script>
</body>
</html>
